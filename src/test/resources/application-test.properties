spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

internal.api-key=test-internal-api-key
cors.allowed-origins=http://localhost:5173

services.employee.url=http://localhost:8091
services.project.url=http://localhost:8092
services.career.url=http://localhost:8093
services.timetrack.url=http://localhost:8094
services.intelligence.url=http://localhost:8095

app.jobs.poll-delay-ms=3600000
app.jobs.batch-size=10
app.outbox.poll-delay-ms=3600000
app.housekeeping.cron=0 0 3 * * *

logging.level.com.zodiakk.analyticservice=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN
