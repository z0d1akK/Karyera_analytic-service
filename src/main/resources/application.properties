spring.application.name=analytic-service

spring.config.import=optional:file:.env[.properties]

spring.profiles.active=${ACTIVE_PROFILE}

internal.api-key=${INTERNAL_API_KEY}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.outbox.batch-size=10
app.outbox.poll-delay-ms=2000
app.outbox.lease-seconds=180
app.outbox.send-timeout-seconds=15

app.housekeeping.cron=0 0 3 * * *
app.housekeeping.outbox-retention-days=7
app.housekeeping.processed-events-retention-days=30

app.jobs.batch-size=1
app.jobs.poll-delay-ms=1000
app.jobs.lease-seconds=900

app.methodology.version=1.0
app.methodology.skill-weight=0.70
app.methodology.experience-weight=0.20
app.methodology.project-weight=0.10

app.kafka.topics.analytics-events=analytics.events.v1
app.kafka.topics.employee-events=employee.events.v1
app.kafka.topics.career-events=career.events.v1
app.kafka.topics.project-events=project.events.v1
app.kafka.topics.time-events=time.events.v1

spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=200000
spring.cloud.openfeign.client.config.intelligent-service.connect-timeout=5000
spring.cloud.openfeign.client.config.intelligent-service.read-timeout=200000
spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.timelimiter.configs.default.timeoutDuration=200s
resilience4j.timelimiter.instances.[intelligent-service].timeoutDuration=200s

spring.kafka.consumer.group-id=analytic-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@
info.app.java=${java.version}

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.zodiakk=TRACE
