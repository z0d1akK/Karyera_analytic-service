databaseChangeLog:

  - changeSet:
      id: 001-create-analytics-jobs
      author: zodiakk

      changes:
        - createTable:
            tableName: analytics_jobs
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: requested_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: parameters
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: result
                  type: JSONB
              - column:
                  name: idempotency_key
                  type: VARCHAR(120)
              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: max_attempts
                  type: INTEGER
                  defaultValueNumeric: 3
                  constraints:
                    nullable: false
              - column:
                  name: result_id
                  type: UUID
              - column:
                  name: error_code
                  type: VARCHAR(100)
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE analytics_jobs ADD CONSTRAINT chk_analytics_job_attempts CHECK (attempts >= 0 AND max_attempts > 0);
