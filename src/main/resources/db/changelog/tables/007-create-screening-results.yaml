databaseChangeLog:

  - changeSet:
      id: 007-create-screening-results
      author: zodiakk

      changes:
        - createTable:
            tableName: screening_results
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: screening_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: assessment_id
                  type: UUID
              - column:
                  name: rank
                  type: INTEGER
              - column:
                  name: score
                  type: NUMERIC(8,6)
              - column:
                  name: eligibility_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: mandatory_requirements_met
                  type: BOOLEAN
              - column:
                  name: exclusion_reason
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: screening_results
            baseColumnNames: screening_id
            referencedTableName: talent_screenings
            referencedColumnNames: id
            constraintName: fk_screening_result_screening

        - addForeignKeyConstraint:
            baseTableName: screening_results
            baseColumnNames: assessment_id
            referencedTableName: career_assessments
            referencedColumnNames: id
            constraintName: fk_screening_result_assessment

        - addUniqueConstraint:
            tableName: screening_results
            columnNames: screening_id, employee_id
            constraintName: uq_screening_employee

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE screening_results ADD CONSTRAINT chk_screening_result_rank CHECK (rank IS NULL OR rank >= 1);
              ALTER TABLE screening_results ADD CONSTRAINT chk_screening_result_score CHECK (score IS NULL OR score BETWEEN 0 AND 1);
