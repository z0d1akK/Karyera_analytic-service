databaseChangeLog:

  - changeSet:
      id: 002-create-career-assessments
      author: zodiakk

      changes:
        - createTable:
            tableName: career_assessments
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_position_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: target_grade_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: requirement_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: requirement_revision
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: methodology_version
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: skill_score
                  type: NUMERIC(8,6)
                  constraints:
                    nullable: false
              - column:
                  name: experience_score
                  type: NUMERIC(8,6)
              - column:
                  name: total_score
                  type: NUMERIC(8,6)
                  constraints:
                    nullable: false
              - column:
                  name: mandatory_requirements_met
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: data_quality_status
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
              - column:
                  name: input_snapshot
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: input_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: is_stale
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: calculated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: career_assessments
            baseColumnNames: job_id
            referencedTableName: analytics_jobs
            referencedColumnNames: id
            constraintName: fk_career_assessment_job

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE career_assessments ADD CONSTRAINT chk_career_assessment_revision CHECK (requirement_revision > 0);
              ALTER TABLE career_assessments ADD CONSTRAINT chk_assessment_scores CHECK (skill_score BETWEEN 0 AND 1 AND total_score BETWEEN 0 AND 1 AND (experience_score IS NULL OR experience_score BETWEEN 0 AND 1));
