databaseChangeLog:

  - changeSet:
      id: 008-create-employee-analytics-profiles
      author: zodiakk

      changes:
        - createTable:
            tableName: employee_analytics_profiles
            columns:
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: position_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: grade_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: last_source_event_id
                  type: UUID
              - column:
                  name: source_version
                  type: BIGINT
              - column:
                  name: last_synced_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: stale
                  type: BOOLEAN
                  constraints:
                    nullable: false
