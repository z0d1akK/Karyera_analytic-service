databaseChangeLog:

  - changeSet:
      id: 009-create-employee-activity-aggregates
      author: zodiakk

      changes:
        - createTable:
            tableName: employee_activity_aggregates
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: period_start
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: period_end
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: completed_tasks
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: completed_story_points
                  type: NUMERIC(12,2)
              - column:
                  name: approved_minutes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source_updated_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_calculated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: employee_activity_aggregates
            columnNames: employee_id, project_id, period_start
            constraintName: uq_activity_aggregate

        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE employee_activity_aggregates ADD CONSTRAINT chk_activity_totals CHECK (completed_tasks >= 0 AND approved_minutes >= 0);
              ALTER TABLE employee_activity_aggregates ADD CONSTRAINT chk_activity_period CHECK (period_end >= period_start);
